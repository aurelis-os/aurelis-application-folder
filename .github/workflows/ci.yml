name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus \
            libglib2.0-dev \
            squashfs-tools \
            zsync \
            libfuse2

      - name: Install appimageupdatetool (optional)
        run: |
          # appimageupdatetool is not published in AppImageKit releases; fallback to zsync in code
          echo "Skipping appimageupdatetool install (not available); zsync will be used as fallback"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start D-Bus session bus
        run: |
          # Start a D-Bus session daemon
          mkdir -p /tmp/dbus-test
          dbus-daemon --session --address=unix:path=/tmp/dbus-test --fork --print-address > /tmp/dbus-address.txt
          cat /tmp/dbus-address.txt
          export DBUS_SESSION_BUS_ADDRESS=$(cat /tmp/dbus-address.txt)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV

      - name: Run tests
        run: |
          make test COV=1
        env:
          DBUS_SESSION_BUS_ADDRESS: ${{ env.DBUS_SESSION_BUS_ADDRESS }}
          APPIMAGE_LAUNCHER_HOME: ${{ runner.temp }}/appimage-launcher
          QT_QPA_PLATFORM: offscreen

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false