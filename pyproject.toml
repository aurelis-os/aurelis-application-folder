[project]
name = "appimage-launcher"
version = "0.1.0"
description = "AppImage Launcher: Daemon, CLI and KDE GUI for managing AppImages in ~/Applications"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "inotify-simple>=1.3.5",
    "dbus-fast>=0.25.0",
    "tomli-w>=1.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: KDE",
    "Topic :: System :: Software Distribution",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.5.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-qt>=4.2.0",
    "PyQt6>=6.5.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["appimage_launcher*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T201"]  # allow assert and print in tests
"src/appimage_launcher/cli/*" = ["T201"]  # allow print in CLI
"src/appimage_launcher/daemon/dbus_service.py" = ["N802", "UP037", "F821", "F722"]  # D-Bus type signatures and method names
"src/appimage_launcher/daemon/conflicts.py" = ["N818"]  # Exception name matches D-Bus error

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["appimage_launcher"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false
strict = false
exclude = ["src/appimage_launcher/gui", "src/appimage_launcher/daemon"]

[[tool.mypy.overrides]]
module = "appimage_launcher.*"
strict = false

[[tool.mypy.overrides]]
module = "inotify_simple"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "PyQt6"
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "PyQt6.*"
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "contract: Contract tests",
    "gui: GUI tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["src/appimage_launcher"]
omit = ["tests/*", "src/appimage_launcher/gui/*"]

[tool.coverage.report]
fail_under = 30
precision = 2
show_missing = true